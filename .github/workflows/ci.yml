# Continuous integration (design D.12.9, WP-F3).
#
# On every push to main and every pull request:
#   verify  scripts/verify.sh --no-model --no-kani: cargo fmt; clippy with -D warnings on the
#           default build, the usability build, and the scale gates' build (bench-gates profile,
#           cfg forum_bench); the three guard rails of D.1.3; cargo test --workspace (the committed
#           conformance fixtures among them), the usability build's tests, and the bench-gates
#           build's; the generated tables of docs/verification.md; and the usability harness's own
#           unit tests, which spend no model tokens.
#   model   the Quint model's typecheck and run tests (npm ci in model/), then the conformance
#           tests with the model's Quint on PATH (D.10.8).
#
# The formal checks of the key invariants (D.0.3: Kani, TLC and its liveness checks, and the
# conformance sweep) are not run here: they run locally, through scripts/verify.sh's full run,
# after a change to the core or the model and before a release. The model's simulation, the scale
# gates, and the live usability test are not run here either: the first belongs to that full run,
# the gates need the reference hardware (D.12.8), and the usability test spends model tokens
# (D.12.9, step 9). workflow_dispatch runs the two jobs above by hand.
#
# No secrets are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash with -e and pipefail, so that a command piped into tee still fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: verify.sh (Rust, guard rails, tests, harness)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scripts/verify.sh --no-model --no-kani
        run: scripts/verify.sh --no-model --no-kani

  model:
    name: Quint model and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: model/package-lock.json
      - name: npm ci
        working-directory: model
        run: npm ci
      - name: npm run typecheck
        working-directory: model
        run: npm run typecheck
      - name: npm test
        working-directory: model
        run: npm test
      - name: Conformance tests, with the model's Quint on PATH
        run: |
          export PATH="$GITHUB_WORKSPACE/model/node_modules/.bin:$PATH"
          cargo test -p forum-conformance
